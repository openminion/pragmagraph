[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pragmagraph"
version = "0.0.1"
description = "Standalone observed-fact graph substrate for code and document structure"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PragmaGraph Contributors" }]
keywords = ["agent", "knowledge-graph", "code-intelligence", "documents", "observed-facts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Repository = "https://github.com/openminion/pragmagraph"
Download = "https://pypi.org/project/pragmagraph/"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
  "twine>=5,<7",
]

[project.scripts]
pragmagraph = "pragmagraph.__main__:main"
pragmagraph-smoke = "pragmagraph.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
