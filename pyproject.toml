[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pragmagraph"
version = "0.0.7"
description = "Standalone observed-fact graph substrate for code and document structure"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PragmaGraph Contributors" }]
keywords = ["agent", "knowledge-graph", "code-intelligence", "documents", "observed-facts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "graphfakos>=0.0.5,<1",
]

[project.urls]
Repository = "https://github.com/openminion/pragmagraph"
Download = "https://pypi.org/project/pragmagraph/"

[project.optional-dependencies]
server = []
precise = [
  "tree-sitter>=0.25,<1",
  "tree-sitter-language-pack>=1.8,<2",
]
scip = [
  "protobuf>=7.35,<8",
]
dev = [
  "build>=1,<2",
  "pre-commit>=4,<5",
  "protobuf>=7.35,<8",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
  "tree-sitter>=0.25,<1",
  "tree-sitter-language-pack>=1.8,<2",
  "twine>=5,<7",
]

[project.scripts]
pragmagraph = "pragmagraph.__main__:main"
pragmagraph-smoke = "pragmagraph.__main__:main"
pragmagraph-ui = "pragmagraph.__main__:ui_preview_main"
pragmagraph-server = "pragmagraph.server.__main__:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
