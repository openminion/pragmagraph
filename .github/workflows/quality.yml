name: Quality

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pragmagraph
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pragmagraph

      - name: Check out GraphFakos live contracts
        uses: actions/checkout@v4
        with:
          repository: openminion/graphfakos
          ref: v0.0.9
          path: graphfakos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev environment
        run: make dev-install

      - name: Verify published-dependency import compatibility
        run: ./.venv/bin/python3.11 -c "import pragmagraph.ui"

      - name: Validate pre-commit config
        run: ./.venv/bin/python3.11 -m pre_commit validate-config

      - name: Run pre-commit on changed files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            base_commit="$(git merge-base HEAD FETCH_HEAD)"
            ./.venv/bin/python3.11 -m pre_commit run \
              --from-ref "${base_commit}" \
              --to-ref HEAD \
              --show-diff-on-failure
            exit 0
          fi
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            ./.venv/bin/python3.11 -m pre_commit run \
              --from-ref "${BEFORE_SHA}" \
              --to-ref HEAD \
              --show-diff-on-failure
            exit 0
          fi
          files=(
            .pre-commit-config.yaml
            .github/release.yml
            .github/workflows/release.yml
            .github/workflows/quality.yml
            CONTRIBUTING.md
            docs/getting-started.md
            Makefile
            scripts/baselines/*.tsv
            scripts/validate_quality_patterns.py
            scripts/validate_commit_message.py
          )
          ./.venv/bin/python3.11 -m pre_commit run \
            --files "${files[@]}" \
            --show-diff-on-failure

      - name: Validate pushed commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          commits=()
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            base_commit="$(git merge-base HEAD FETCH_HEAD)"
            mapfile -t commits < <(git rev-list --reverse "${base_commit}..HEAD")
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t commits < <(git rev-list --reverse "${BEFORE_SHA}..HEAD")
          fi
          if [[ ${#commits[@]} -eq 0 ]]; then
            commits=(HEAD)
          fi
          for commit in "${commits[@]}"; do
            subject="$(git log -1 --format=%s "${commit}")"
            echo "Checking ${commit}: ${subject}"
            ./.venv/bin/python3.11 scripts/validate_commit_message.py --subject "${subject}"
          done

      - name: Run package check
        run: make check

      - name: Run release smoke
        run: make release-check
