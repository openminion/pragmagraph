name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v0.0.1)"
        required: true
        type: string
      publish_testpypi:
        description: "Publish wheel and sdist to TestPyPI"
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: "Publish wheel and sdist to PyPI"
        required: false
        default: false
        type: boolean

jobs:
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build

      - name: Run package checks
        run: |
          python -m pip install -e ".[dev]"
          make check

      - name: Build wheel and sdist
        run: |
          rm -rf build dist src/*.egg-info
          python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          if-no-files-found: error
          path: dist

  release:
    name: Publish Release
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: release-assets

      - name: Verify release assets
        run: |
          ls -la release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz

      - name: Publish package to TestPyPI (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.test-pypi-token }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release-assets

      - name: Publish package to PyPI (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi-token }}
          packages-dir: release-assets
