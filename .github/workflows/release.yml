name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string
      publish_pypi:
        description: "Publish wheels to PyPI"
        required: false
        default: false
        type: boolean

jobs:
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build

      - name: Run package checks
        run: |
          python -m pip install -e ".[dev]"
          make check

      - name: Build wheel and sdist
        run: |
          rm -rf build dist src/*.egg-info
          python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          if-no-files-found: error
          path: dist

  release:
    name: Publish Release
    needs: build-package
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/reusable-release.yml
    secrets: inherit
    with:
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      publish_pypi: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pypi || false }}
